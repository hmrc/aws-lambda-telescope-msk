[project]
name = "aws-lambda-telescope-msk"
version = "0.1.0"
description = "Telescope library for interacting with an MSK/Kafka cluster"
authors = [{ name = "Team Telemetry", email = "telemetry@digital.hmrc.gov.uk" }]
license = "Apache 2.0"
maintainers = [{ name = "Team Telemetry", email = "telemetry@digital.hmrc.gov.uk" }]
readme = "README.md"
requires-python = ">=3.14,<3.15"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "aws-lambda-powertools",
    "confluent-kafka",
    "cryptography",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "aws-lambda-context",
    "bandit",
    "black",
    "boto3",
    "colorama",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-ruff",
    "version-incrementor>=1.10.0,<2",
]

[tool.coverage.run]
source = ["./src"]

[tool.coverage.report]
fail_under = 45

[[tool.uv.index]]
name = "artifactory"
url = "https://artefacts.tax.service.gov.uk/artifactory/api/pypi/pips/simple"
default = true

[tool.pytest.ini_options]
log_cli = true
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_level = "INFO"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_level = "INFO"
python_files = ["tests.py", "test_*.py", "*_tests.py", "*_test.py"]
pythonpath = ". src"
addopts = [
    "--ruff",
    "--cov=./src",
    "--no-cov-on-fail",
    "-p no:warnings"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W"]

[tool.uv]
package = false
default-groups = "all"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
