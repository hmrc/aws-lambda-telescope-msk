[project]
name = "aws-lambda-telescope-msk"
version = "0.1.0"
description = "Telescope library for interacting with an MSK/Kafka cluster"
authors = [{ name = "Team Telemetry", email = "telemetry@digital.hmrc.gov.uk" }]
requires-python = ">=3.10.15,<4"
readme = "README.md"
license = "Apache 2.0"
maintainers = [{ name = "Team Telemetry" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aws-lambda-powertools>=2.33.1,<3",
    "boto3>=1.34.38,<2",
    "confluent-kafka==2.4.0",
    "cryptography>=46.0.4,<47",
    "pre-commit>=4.5.1,<5",
    "urllib3>=1.25.4,<1.27",
]

[dependency-groups]
dev = [
    "aws-lambda-context>=1.1.0,<2",
    "bandit>=1.9.3,<2",
    "black>=26.1.0,<27",
    "colorama>=0.4.5,<0.5",
    "cookiecutter>=2.1.1,<3",
    "flake8>=7.0.0,<8",
    "pytest>=8.0.0,<9",
    "pytest-cov>=4.1.0,<5",
    "version-incrementor>=1.10.0,<2",
]

[tool.coverage.html]
directory = "output/htmlcov"

[tool.coverage.xml]
directory = "output/xml"

[tool.coverage.run]
source = ["./src"]

[tool.coverage.report]
fail_under = 70

[tool.pytest.ini_options]
log_cli = true
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_level = "INFO"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_level = "INFO"
python_files = ["tests.py", "test_*.py", "*_tests.py", "*_test.py"]
pythonpath = ". src"
addopts = [
    "--ruff",
    "--cov=./src",
    "--cov-report=xml",
    "--no-cov-on-fail",
    "-p no:warnings"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W"]        # pycodestyle-equivalent checks

[tool.uv]
package = false
default-groups = "all"

[[tool.uv.index]]
name = "artifactory"
url = "https://artefacts.tax.service.gov.uk/artifactory/api/pypi/pips/simple/"
default = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
